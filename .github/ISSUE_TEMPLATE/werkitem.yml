name: Werkitem
description: Een wijziging aan het cursusmateriaal (C0)
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Dit is een **C0 Werkitem**, de invoer van de rollenlus. Zie
        `.claude/agent-role-loop/core/contracts/C0-werkitem.md`.

        Het beschrijft de gewenste uitkomst, niet de uitvoering. Het ontwerp komt
        later, van de curriculumontwerper.

  - type: checkboxes
    id: vooraf
    attributes:
      label: Vóór het ontwerp
      description: >
        Raadpleeg het projectbord op open `doorlopend`-issues die dit werk raken,
        en op eerder geparkeerde gevolgen die hier neerslaan. Neem wat van
        toepassing is mee in de acceptatiecriteria of de afbakening, zodat de
        ontwerpfase niet aan geheugen hangt.
      options:
        - label: Ik heb het bord geraadpleegd op doorlopende zaken die dit raken
        - label: Ik heb in `curriculum/uitgangspunten.md` gekeken of hier al een besluit over is genomen

  - type: textarea
    id: aanleiding
    attributes:
      label: Aanleiding
      description: Waarom dit werk bestaat; het waargenomen probleem of de aanleiding. Een korte alinea.
      placeholder: |
        Week 5 introduceert geneste lussen met een bord dat nooit verandert. De
        student leert een raster lezen en niet bijwerken, terwijl week 7 om
        bijwerken vraagt.
    validations:
      required: true

  - type: textarea
    id: uitkomst
    attributes:
      label: Gewenste uitkomst
      description: Wat waar is als het werk slaagt, geformuleerd als waarneembaar resultaat.
      placeholder: |
        Een student die week 5 heeft gedaan kan een tweedimensionale structuur
        aanmaken en doorlopen, en weet wat er wel en niet aan verandert.
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: Acceptatiecriteria
      description: >
        Genummerd en toetsbaar. Laat leeg als je ze niet kunt formuleren; de
        curriculumontwerper leidt ze dan af en de vakdeskundige bevestigt ze bij
        de poort. Het laatste criterium staat vast en hoort in elk werkitem.
      value: |
        1. 
        2. 
        3. Voldoet aan de conventies in `conventies/conventies.md`, en de build is schoon.
    validations:
      required: true

  - type: textarea
    id: randvoorwaarden
    attributes:
      label: Randvoorwaarden
      description: Harde grenzen; een deadline, een besluit dat vastligt, een leeruitkomst die gedekt moet blijven.
      placeholder: "<geen>"

  - type: textarea
    id: context
    attributes:
      label: Wat de repo niet weet
      description: >
        Geschiedenis, afspraken of ervaringen die nergens zijn vastgelegd. Dit is
        het waardevolste veld: wat hier niet staat, wordt straks geraden.
      placeholder: |
        Het bord in week 5 is bewust nooit gewijzigd, omdat mutatie pas in week 7
        komt. Dat staat in het besluitenregister als open vraag.

  - type: dropdown
    id: omvang
    attributes:
      label: Omvangschatting
      description: De triage mag hem overrulen.
      options: ["XS", "S", "M", "L", "XL"]
    validations:
      required: true
