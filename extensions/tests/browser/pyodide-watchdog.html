<!doctype html>
<meta charset="utf-8">
<title>Pyodide watchdog browserreproductie</title>
<script type="module" src="/extensions/sphinx_interactive_code/static/interactive-code.js"></script>
<style>body { font: 16px sans-serif; max-width: 50rem; margin: 2rem auto; } .case { margin: 1rem 0; } #report { white-space: pre-wrap; }</style>
<h1>Pyodide watchdog</h1>
<p id="report">Laden…</p>
<script>addEventListener("error", (event) => { document.querySelector("#report").textContent += `\\nJS error: ${event.message}`; });</script>
<div class="case"><interactive-code-cell>x = 41
print(x + 1)</interactive-code-cell></div>
<div class="case"><interactive-code-cell>while True: pass</interactive-code-cell></div>
<div class="case"><interactive-code-cell>raise ValueError("voorbeeld")</interactive-code-cell></div>
<div class="case"><interactive-code-cell>naam = input("Naam? ")
print(naam)</interactive-code-cell></div>
<div class="case"><interactive-code-cell>print(globals().get("x", "MISSING"))</interactive-code-cell></div>
<script>
  const report = document.querySelector("#report");
  report.textContent = [
    `crossOriginIsolated: ${globalThis.crossOriginIsolated}`,
    "Voer de cellen na elkaar uit; een tweede knop moet tijdens uitvoering disabled zijn.",
    "Meet timeout vanaf klik tot timeoutmelding en controleer daarna dat een snelle cel opnieuw werkt.",
    "Open DevTools Network en herhaal de pagina voor koude/warme CDN-cache.",
  ].join("\\n");
  if (new URLSearchParams(location.search).has("auto")) {
    const started = performance.now();
    const waitFor = (output, text) => new Promise((resolve) => {
      const observer = new MutationObserver(() => {
        if (output.textContent.includes(text)) { observer.disconnect(); resolve(); }
      });
      observer.observe(output, { childList: true, characterData: true, subtree: true });
    });
    setTimeout(() => {
      const loopButton = document.querySelectorAll(".sic-btn-run")[1];
      loopButton.click();
      const output = loopButton.closest("interactive-code-cell").querySelector(".sic-output");
      waitFor(output, "te lang").then(async () => {
        report.textContent += `\\nauto timeout: ${(performance.now() - started).toFixed(0)} ms`;
        const buttons = document.querySelectorAll(".sic-btn-run");
        const retryOutput = buttons[0].closest("interactive-code-cell").querySelector(".sic-output");
        buttons[0].click(); await waitFor(retryOutput, "42");
        report.textContent += "\\nauto retry: 42";
        const errorOutput = buttons[2].closest("interactive-code-cell").querySelector(".sic-output");
        buttons[2].click(); await waitFor(errorOutput, "Python-fout");
        report.textContent += "\\nauto exception: Python-fout";
        if (globalThis.crossOriginIsolated) {
          buttons[3].click();
          await new Promise((resolve) => {
            const check = () => document.querySelector(".sic-input-dialog") ? resolve() : setTimeout(check, 50);
            check();
          });
          document.querySelector(".sic-input-dialog [data-cancel]").click();
          report.textContent += document.querySelector(".sic-input-dialog") ? "\\nauto input: cleanup-fout" : "\\nauto input: geannuleerd";
        } else report.textContent += "\\nauto input: overgeslagen zonder cross-origin isolation";
      });
    }, 5000);
  }
</script>
