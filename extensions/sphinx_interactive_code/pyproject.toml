[project]
name = "sphinx-interactive-code"
version = "0.1.0"
description = "Sphinx extension for interactive code cells with Pyodide and AI coaching"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sphinx>=7.0",
    "sphinx-design",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sphinx_interactive_code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
