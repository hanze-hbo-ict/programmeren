repos:
  - repo: local
    hooks:
      - id: no-commit-to-master
        name: Blokkeer commits op master
        language: system
        entry: .claude/no-commit-to-master.sh
        pass_filenames: false
        always_run: true

      - id: check-code-blocks
        name: Python syntaxcontrole en opmaak in markdown en notebooks
        language: system
        entry: python3 .claude/check-code-blocks.py
        types_or: [markdown, jupyter]
        files: ^source/.*\.(md|ipynb)$
        pass_filenames: true

      - id: check-notebook-tags
        name: Celtags in notebooks (opgaven leeg, uitwerkingen draaien)
        language: system
        entry: python3 .claude/check-notebook-tags.py
        types: [jupyter]
        files: ^source/.*\.ipynb$
        pass_filenames: true

      - id: check-kopwoord
        name: Kopwoord en niveaunaam (Opdracht, en opstap/basis/extra)
        language: system
        entry: python3 .claude/check-kopwoord.py
        types_or: [markdown, jupyter]
        files: ^source/.*\.(md|ipynb)$
        # De vier oefententamens houden hun `Opgave N`-koppen; de grond staat in
        # conventies/conventies.md, onder Reikwijdte.
        exclude: ^source/(extra/practice/(pgm1_examen\.ipynb|PGM2_examen\.md)|solutions/PGM[12]_examen\.ipynb)$
        pass_filenames: true

      - id: pymarkdown
        name: Markdown linting (pymarkdown)
        language: system
        entry: uv run pymarkdown --config pyproject.toml scan
        types: [markdown]
        files: ^(source|conventies|curriculum|handleidingen|rollen)/.*\.md$
        pass_filenames: true

      - id: nbstripout
        name: Strip notebook outputs
        language: system
        entry: uv run nbstripout
        types: [jupyter]
        files: ^source/.*\.ipynb$
        pass_filenames: true
